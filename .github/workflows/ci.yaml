name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest -q

  addon-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./battery_pilot"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the amd64 image
        run: >
          docker build battery_pilot -t battery-pilot:ci
          --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.21
          --build-arg BUILD_VERSION=ci
      - name: Smoke test the image (through s6-overlay's /init, as the Supervisor starts it)
        run: >
          docker run --rm -e SUPERVISOR_TOKEN=ci battery-pilot:ci /command/with-contenv python3 -c
          "import os, pilot.app, pilot.web, pilot.__main__;
          assert os.environ.get('SUPERVISOR_TOKEN') == 'ci', 'SUPERVISOR_TOKEN lost';
          assert os.environ.get('BP_VERSION') == 'ci', 'BP_VERSION lost'; print('ok')"
