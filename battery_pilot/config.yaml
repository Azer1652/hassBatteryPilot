name: Battery Pilot
version: "2.5.0"
slug: battery_pilot
description: Plans and steers a Solis home battery against your contract, prices, solar forecast and tree shade, and compares fixed with dynamic contracts
url: https://github.com/Azer1652/hassSolarBattery
arch:
  - aarch64
  - amd64
init: false
startup: services
homeassistant_api: true
ingress: true
panel_icon: mdi:battery-sync
panel_title: Battery Pilot
map:
  - type: homeassistant_config
    read_only: false
options:
  contract: fixed
  fixed_contract_end: ""
  fixed_day_rate: 18.59
  fixed_night_rate: 15.22
  fixed_yearly_fee_eur: 65
  fixed_sell_mult: 0.0798
  fixed_sell_add: -2.72
  dynamic_buy_mult: 0.102
  dynamic_buy_add: 1.0
  dynamic_vat_pct: 6
  dynamic_sell_mult: 0.1
  dynamic_sell_add: -1.188
  dynamic_yearly_fee_eur: 100
  grid_fees_c_kwh: 11.96
  injection_fee_c_kwh: 0.19
  night_start: "22:00"
  night_end: "07:00"
  weekend_is_night: true
  import_limit_kw: 2.3
  export_limit_kw: 5.0
  capacity_tariff_eur_kw_year: 52.37
  capacity_min_kw: 2.5
  battery_capacity_kwh: 16
  battery_min_soc: 10
  battery_reserve_soc: 35
  battery_voltage: 51.2
  max_charge_current_a: 50
  max_discharge_current_a: 90
  round_trip_efficiency_pct: 90
  wear_cost_c_kwh: 2.0
  safety_margin_pct: 30
  winter_solar_threshold_kwh: 12
  winter_mode: full_day
  slot_entities: time_charging
schema:
  contract: list(fixed|dynamic)
  fixed_contract_end: match(^(\d{4}-\d{2}-\d{2})?$)
  fixed_day_rate: float(0,100)
  fixed_night_rate: float(0,100)
  fixed_yearly_fee_eur: float(0,1000)
  fixed_sell_mult: float(0,1)
  fixed_sell_add: float(-50,50)
  dynamic_buy_mult: float(0,1)
  dynamic_buy_add: float(-20,50)
  dynamic_vat_pct: float(0,30)
  dynamic_sell_mult: float(0,1)
  dynamic_sell_add: float(-50,50)
  dynamic_yearly_fee_eur: float(0,1000)
  grid_fees_c_kwh: float(0,60)
  injection_fee_c_kwh: float(0,20)
  night_start: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  night_end: match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  weekend_is_night: bool
  import_limit_kw: float(0.5,50)
  export_limit_kw: float(0,50)
  capacity_tariff_eur_kw_year: float(0,500)
  capacity_min_kw: float(0,20)
  battery_capacity_kwh: float(1,200)
  battery_min_soc: int(0,50)
  battery_reserve_soc: int(0,95)
  battery_voltage: float(12,1000)
  max_charge_current_a: int(5,500)
  max_discharge_current_a: int(5,500)
  round_trip_efficiency_pct: int(50,100)
  wear_cost_c_kwh: float(0,50)
  safety_margin_pct: int(0,60)
  winter_solar_threshold_kwh: float(0,200)
  winter_mode: list(full_day|peaks_only)
  slot_entities: list(time_charging|grid_time_of_use)
  notify_service: str?
  grid_import_power: str?
  grid_export_power: str?
  house_load_power: str?
  pv_power: str?
  battery_soc: str?
  battery_voltage_sensor: str?
  tou_switch: str?
  grid_charge_switch: str?
  charge_current: str?
  discharge_current: str?
  charge_start: str?
  charge_end: str?
  discharge_start: str?
  discharge_end: str?
  export_limit: str?
  peak_shaving_switch: str?
  peak_shaving_limit: str?
  peak_shaving_soc: str?
  feed_in_priority_switch: str?
  forecast_power_now: str?
  forecast_today: str?
  forecast_tomorrow: str?
  price_sensor: str?
