# =====================================================================
# PEAK SHAVING – Fluvius capacity tariff (Flanders)
# Solis S6-EH1P via Solis Modbus (Pho3niX90) + Dyness 16 kWh
#
# For your Eneco fixed day/night contract, this winter:
#   * Night window (22:00-07:00): charge the battery from the grid, with a
#     charge current that follows house load, so grid import stays under
#     the limit (default 2.3 kW; Fluvius bills at least 2.5 kW anyway).
#   * Pauses charging (battery back to self-use) whenever the quarter-hour
#     average would go over the limit, e.g. dishwasher or dryer at night.
#   * Daytime: normal self-use. The battery covers day and evening peaks.
#   * Night target SOC is solar-aware: it only buys what tomorrow's solar
#     won't cover, because every grid-charged kWh costs ~10% losses + wear.
#   * Learns how far your real production falls short of the forecast
#     (trees, haze) and corrects the forecast with that, season by season.
#   * Tracks the quarter-hour average, this month's peak, battery cycles
#     and the wear cost of those cycles.
#
# INSTALL
#   1. Copy this file to /config/packages/peak_shaving.yaml
#   2. In configuration.yaml:
#        homeassistant:
#          packages: !include_dir_named packages
#   3. Check every line marked  # set by the Battery Playbook app
#      (Settings > Devices & services > Solis Modbus > entities).
#   4. Developer tools > YAML > Check configuration, then restart.
#
# Also used by dynamic_tariff.yaml (script.ps_inverter + ps_* sensors).
# =====================================================================

input_boolean:
  ps_enabled:
    name: "Peak shaving enabled"
    icon: mdi:chart-bell-curve-cumulative
  ps_winter_mode:
    name: "Peak shaving winter mode (night grid charging)"
    icon: mdi:snowflake
  ps_charged_tonight:
    name: "Peak shaving – target reached tonight"
    icon: mdi:battery-check

input_number:
  ps_import_limit:
    name: "Grid import limit"
    min: 1.5
    max: 5.0
    step: 0.1
    unit_of_measurement: kW
    initial: @@import_limit@@
  ps_target_soc:
    name: "Max night charge target SOC"
    min: 30
    max: 100
    step: 5
    unit_of_measurement: "%"
    initial: 100
  ps_max_charge_current:
    name: "Max night charge current"
    min: 10
    max: 100
    step: 5
    unit_of_measurement: A
    initial: 50
  ps_soc_margin:
    name: "Night target safety margin"
    min: 0
    max: 50
    step: 5
    unit_of_measurement: "%"
    initial: @@night_margin@@
  ps_wear_cost:
    name: "Battery wear cost"
    # Rough rule: replacement cost / (rated cycles x usable kWh).
    # Check your Dyness warranty for cycle or MWh limits.
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: c/kWh
    initial: 2
  ps_winter_forecast_kwh:
    name: "Winter mode when tomorrow's solar is below"
    min: 0
    max: 30
    step: 1
    unit_of_measurement: kWh
    initial: 12

input_datetime:
  ps_window_start:
    name: "Night charge window start"
    has_date: false
    has_time: true
    initial: "@@window_start@@"
  ps_window_end:
    name: "Night charge window end"
    has_date: false
    has_time: true
    initial: "@@window_end@@"

template:
  # ---------- readings from the inverter (MAP the source entities) ----------
  - sensor:
      - name: "PS grid import"
        unique_id: ps_grid_import
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        # set by the Battery Playbook app
        state: "{{ (states('@@grid_import_power@@') | float(0) * @@grid_import_power_scale@@) | round(3) }}"
        availability: "{{ has_value('@@grid_import_power@@') }}"

      - name: "PS house load"
        unique_id: ps_house_load
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        # set by the Battery Playbook app
        state: "{{ (states('@@house_load_power@@') | float(0) * @@house_load_power_scale@@) | round(3) }}"
        availability: "{{ has_value('@@house_load_power@@') }}"

      - name: "PS battery SOC"
        unique_id: ps_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        # set by the Battery Playbook app
        state: "{{ states('@@battery_soc@@') | float(0) }}"
        availability: "{{ has_value('@@battery_soc@@') }}"

      - name: "PS battery voltage"
        unique_id: ps_battery_voltage
        unit_of_measurement: V
        device_class: voltage
        # set by the Battery Playbook app
        state: "{{ states('@@battery_voltage@@') | float(51.2) }}"

      - name: "PS PV power"
        unique_id: ps_pv_power
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        # set by the Battery Playbook app
        state: "{{ (states('@@pv_power@@') | float(0) * @@pv_power_scale@@) | round(3) }}"
        availability: "{{ has_value('@@pv_power@@') }}"

      - name: "PS battery discharge"
        unique_id: ps_battery_discharge
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        # set by the Battery Playbook app
        state: "{{ (states('@@battery_discharge_power@@') | float(0) * @@battery_discharge_power_scale@@) | round(3) }}"
        availability: "{{ has_value('@@battery_discharge_power@@') }}"

      - name: "PS charge current setting"
        unique_id: ps_charge_current_setting
        unit_of_measurement: A
        # set by the Battery Playbook app
        state: "{{ states('@@charge_current@@') | float(0) }}"

      # ---------- derived ----------
      - name: "PS desired charge current"
        unique_id: ps_desired_charge_current
        unit_of_measurement: A
        icon: mdi:current-dc
        # Charge current that keeps grid import at the limit, in 5 A steps.
        # 1.03 covers inverter AC->DC losses.
        state: >
          {% set limit = states('input_number.ps_import_limit') | float(2.3) %}
          {% set load = states('sensor.ps_house_load') | float(0) %}
          {% set v = states('sensor.ps_battery_voltage') | float(51.2) %}
          {% set v = v if v > 40 else 51.2 %}
          {% set maxa = states('input_number.ps_max_charge_current') | float(50) %}
          {% set a = (limit - load) * 1000 / v / 1.03 %}
          {{ [[(a / 5) | int * 5, maxa | int] | min, 0] | max }}

      - name: "PS solar tomorrow"
        unique_id: ps_solar_tomorrow
        unit_of_measurement: kWh
        icon: mdi:solar-power-variant
        # Forecast x learned correction (trees, haze)
        # set by the Battery Playbook app
        state: "{{ (states('@@forecast_tomorrow@@') | float(0) * states('sensor.ps_solar_correction') | float(1)) | round(1) }}"
        availability: "{{ has_value('@@forecast_tomorrow@@') }}"

      - name: "PS solar today remaining"
        unique_id: ps_solar_today_remaining
        unit_of_measurement: kWh
        icon: mdi:solar-power-variant-outline
        # set by the Battery Playbook app
        state: "{{ (states('@@forecast_today_remaining@@') | float(0) * states('sensor.ps_solar_correction') | float(1)) | round(1) }}"
        availability: "{{ has_value('@@forecast_today_remaining@@') }}"

      - name: "PS night target SOC"
        unique_id: ps_night_target_soc
        unit_of_measurement: "%"
        icon: mdi:battery-charging-high
        # Enough to carry the house from 07:00 to 22:00 (~80% of a day's use)
        # after the corrected solar forecast, plus the safety margin.
        state: >
          {% set cons = states('sensor.ps_daily_consumption_avg') | float(13) %}
          {% set solar = states('sensor.ps_solar_tomorrow') if now().hour >= 12 else states('sensor.ps_solar_today_remaining') %}
          {% set need = [cons * 0.8 - solar | float(0) * 0.9, 0] | max %}
          {% set soc = 10 + need / 16 * 100 + states('input_number.ps_soc_margin') | float(30) %}
          {% set cap = states('input_number.ps_target_soc') | float(100) %}
          {{ [[(soc / 5) | round(0, 'ceil') * 5, cap] | min, 30] | max | int }}
        attributes:
          need_kwh: >
            {% set cons = states('sensor.ps_daily_consumption_avg') | float(13) %}
            {% set solar = states('sensor.ps_solar_tomorrow') if now().hour >= 12 else states('sensor.ps_solar_today_remaining') %}
            {{ ([cons * 0.8 - solar | float(0) * 0.9, 0] | max) | round(1) }}

      - name: "PS battery cycles"
        unique_id: ps_battery_cycles
        icon: mdi:battery-sync-outline
        # Full-cycle equivalents since this package was installed (14.4 kWh usable)
        state: "{{ (states('sensor.ps_battery_discharge_energy') | float(0) / 14.4) | round(1) }}"
        attributes:
          wear_cost_eur: "{{ (states('sensor.ps_battery_discharge_energy') | float(0) * states('input_number.ps_wear_cost') | float(2) / 100) | round(2) }}"

      - name: "PS quarter projected"
        unique_id: ps_quarter_projected
        unit_of_measurement: kW
        device_class: power
        icon: mdi:timer-sand
        # Where this quarter-hour's average import (what Fluvius bills) will land
        # if the current import continues to the end of the quarter.
        state: >
          {% set e = states('sensor.ps_import_quarter') | float(0) %}
          {% set n = now() %}
          {% set elapsed = (n.minute % 15) + n.second / 60 %}
          {% set remain_h = (15 - elapsed) / 60 %}
          {{ ((e + states('sensor.ps_grid_import') | float(0) * remain_h) * 4) | round(2) }}

  - binary_sensor:
      - name: "PS time-of-use on"
        unique_id: ps_tou_on
        # set by the Battery Playbook app
        state: "{{ is_state('@@tou_switch@@', 'on') }}"

  # ---------- learning, once a day just before midnight ----------
  - triggers:
      - trigger: time
        at: "23:55:00"
    sensor:
      - name: "PS solar correction"
        unique_id: ps_solar_correction
        icon: mdi:tree
        # Rolling ratio actual / forecast (about a week of memory).
        # Days with almost no forecast are skipped.
        # set by the Battery Playbook app
        state: >
          {% set fc = states('@@forecast_today@@') | float(0) %}
          {% set pv = states('sensor.ps_pv_today') | float(0) %}
          {% set prev = this.state | float(1) if this.state not in ['unknown', 'unavailable', None] else 1 %}
          {% if fc >= 1 %}{{ (0.8 * prev + 0.2 * ([[pv / fc, 0.05] | max, 1.5] | min)) | round(3) }}
          {% else %}{{ prev }}{% endif %}
      - name: "PS daily consumption avg"
        unique_id: ps_daily_consumption_avg
        unit_of_measurement: kWh
        icon: mdi:home-lightning-bolt
        state: >
          {% set today = states('sensor.ps_consumption_today') | float(0) %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable', None] else 0 %}
          {{ (today if prev == 0 else 0.8 * prev + 0.2 * today) | round(2) }}

  # ---------- monthly peak tracker (updates after each quarter-hour) ----------
  - triggers:
      - trigger: time_pattern
        minutes: "/15"
        seconds: 10
    sensor:
      - name: "PS last quarter-hour average"
        unique_id: ps_last_quarter_avg
        unit_of_measurement: kW
        device_class: power
        state: "{{ ((state_attr('sensor.ps_import_quarter', 'last_period') | float(0)) * 4) | round(2) }}"
      - name: "PS monthly peak"
        unique_id: ps_monthly_peak
        unit_of_measurement: kW
        device_class: power
        icon: mdi:chart-timeline-variant-shimmer
        # Resets at the first quarter-hour of each month
        state: >
          {% set q = (state_attr('sensor.ps_import_quarter', 'last_period') | float(0)) * 4 %}
          {% set prev = this.state | float(0) if this.state not in ['unknown', 'unavailable', None] else 0 %}
          {% set new_month = now().day == 1 and now().hour == 0 and now().minute == 0 %}
          {{ 0 if new_month else ([prev, q] | max | round(2)) }}
        attributes:
          billed_kw: "{{ [this.state | float(0), 2.5] | max }}"
          # Fluvius Antwerpen 2026: 52.37 EUR/kW/year incl. VAT
          month_cost_eur: "{{ ([this.state | float(0), 2.5] | max * @@capacity@@ / 12) | round(2) }}"

sensor:
  - platform: integration
    source: sensor.ps_grid_import
    name: "PS grid import energy"
    unique_id: ps_grid_import_energy
    method: left
    round: 4
    unit_time: h
  - platform: integration
    source: sensor.ps_pv_power
    name: "PS PV energy"
    unique_id: ps_pv_energy
    method: left
    round: 3
    unit_time: h
  - platform: integration
    source: sensor.ps_house_load
    name: "PS house energy"
    unique_id: ps_house_energy
    method: left
    round: 3
    unit_time: h
  - platform: integration
    source: sensor.ps_battery_discharge
    name: "PS battery discharge energy"
    unique_id: ps_battery_discharge_energy
    method: left
    round: 3
    unit_time: h

utility_meter:
  ps_pv_today:
    unique_id: ps_pv_today
    source: sensor.ps_pv_energy
    cycle: daily
  ps_consumption_today:
    unique_id: ps_consumption_today
    source: sensor.ps_house_energy
    cycle: daily
  ps_import_quarter:
    unique_id: ps_import_quarter
    source: sensor.ps_grid_import_energy
    cron: "*/15 * * * *"

script:
  ps_inverter:
    alias: "Battery – inverter command"
    description: "Single place that writes to the Solis. Commands: window, resume, current, charge_now, discharge_now, self_use."
    mode: queued
    max: 5
    fields:
      command:
        description: "window | resume | current | charge_now | discharge_now | self_use"
        example: self_use
      amps:
        description: "Charge or discharge current in A"
        example: 30
    variables:
      # ===== MAP: inverter controls =====
      # On S6 firmware the slots may instead be named
      # "Grid Time of Use Charge Start (Slot 1)" etc. Use whichever set
      # actually changes the schedule (check in SolisCloud or the inverter).
      tou_switch: @@tou_switch@@
      grid_charge_switch: @@grid_charge_switch@@
      charge_current: @@charge_current@@
      discharge_current: @@discharge_current@@
      charge_start: @@charge_start@@
      charge_end: @@charge_end@@
      discharge_start: @@discharge_start@@
      discharge_end: @@discharge_end@@
      # ===================================
      a: "{{ amps | int(0) }}"
      hour_start: "{{ now().strftime('%H:00:00') }}"
      hour_end: "{{ '23:59:00' if now().hour == 23 else (now() + timedelta(hours=1)).strftime('%H:00:00') }}"
    sequence:
      - choose:
          # Night window: charge slot = window, discharge slot off
          - conditions: "{{ command == 'window' }}"
            sequence:
              - action: time.set_value
                target: { entity_id: "{{ charge_start }}" }
                data: { time: "{{ states('input_datetime.ps_window_start') }}" }
              - action: time.set_value
                target: { entity_id: "{{ charge_end }}" }
                data: { time: "{{ states('input_datetime.ps_window_end') }}" }
              - action: time.set_value
                target: { entity_id: "{{ discharge_start }}" }
                data: { time: "00:00:00" }
              - action: time.set_value
                target: { entity_id: "{{ discharge_end }}" }
                data: { time: "00:00:00" }
              - action: switch.turn_on
                target: { entity_id: "{{ grid_charge_switch }}" }
              - action: number.set_value
                target: { entity_id: "{{ charge_current }}" }
                data: { value: "{{ a }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ tou_switch }}" }
          # Resume charging inside an existing slot
          - conditions: "{{ command == 'resume' }}"
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ charge_current }}" }
                data: { value: "{{ a }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ tou_switch }}" }
          # Only change the charge current
          - conditions: "{{ command == 'current' }}"
            sequence:
              - action: number.set_value
                target: { entity_id: "{{ charge_current }}" }
                data: { value: "{{ a }}" }
          # Charge for the current clock hour only (expires by itself if HA stops)
          - conditions: "{{ command == 'charge_now' }}"
            sequence:
              - action: time.set_value
                target: { entity_id: "{{ discharge_start }}" }
                data: { time: "00:00:00" }
              - action: time.set_value
                target: { entity_id: "{{ discharge_end }}" }
                data: { time: "00:00:00" }
              - action: time.set_value
                target: { entity_id: "{{ charge_start }}" }
                data: { time: "{{ hour_start }}" }
              - action: time.set_value
                target: { entity_id: "{{ charge_end }}" }
                data: { time: "{{ hour_end }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ grid_charge_switch }}" }
              - action: number.set_value
                target: { entity_id: "{{ charge_current }}" }
                data: { value: "{{ a }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ tou_switch }}" }
          # Discharge (export) for the current clock hour only
          - conditions: "{{ command == 'discharge_now' }}"
            sequence:
              - action: time.set_value
                target: { entity_id: "{{ charge_start }}" }
                data: { time: "00:00:00" }
              - action: time.set_value
                target: { entity_id: "{{ charge_end }}" }
                data: { time: "00:00:00" }
              - action: time.set_value
                target: { entity_id: "{{ discharge_start }}" }
                data: { time: "{{ hour_start }}" }
              - action: time.set_value
                target: { entity_id: "{{ discharge_end }}" }
                data: { time: "{{ hour_end }}" }
              - action: number.set_value
                target: { entity_id: "{{ discharge_current }}" }
                data: { value: "{{ a }}" }
              - action: switch.turn_on
                target: { entity_id: "{{ tou_switch }}" }
          # Back to plain self-use
          - conditions: "{{ command == 'self_use' }}"
            sequence:
              - action: switch.turn_off
                target: { entity_id: "{{ tou_switch }}" }

automation:
  # Decide each evening whether tonight needs grid charging
  - id: ps_winter_mode_auto
    alias: "Peak shaving – set winter mode from solar forecast"
    triggers:
      - trigger: time
        at: "21:30:00"
    actions:
      - variables:
          fc_entity: sensor.ps_solar_tomorrow
          threshold: "{{ states('input_number.ps_winter_forecast_kwh') | float(12) }}"
          winter: >
            {% if has_value(fc_entity) %}{{ states(fc_entity) | float(0) < threshold }}
            {% else %}{{ now().month in [10, 11, 12, 1, 2, 3] }}{% endif %}
      - action: "input_boolean.turn_{{ 'on' if winter else 'off' }}"
        target: { entity_id: input_boolean.ps_winter_mode }

  # Start of the night window
  - id: ps_night_start
    alias: "Peak shaving – start night charging"
    triggers:
      - trigger: time
        at: input_datetime.ps_window_start
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.ps_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.ps_winter_mode
        state: "on"
      - "{{ not is_state('input_boolean.dyn_enabled', 'on') }}"
      - condition: time
        after: input_datetime.ps_window_start
        before: input_datetime.ps_window_end
      - "{{ states('sensor.ps_battery_soc') | float(100) < states('sensor.ps_night_target_soc') | float(100) - 3 }}"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.ps_charged_tonight }
      - action: script.ps_inverter
        data:
          command: window
          amps: "{{ states('sensor.ps_desired_charge_current') | int(0) }}"

  # Follow house load during the night so import stays under the limit
  - id: ps_follow_load
    alias: "Peak shaving – follow house load while charging"
    mode: single
    triggers:
      - trigger: time_pattern
        minutes: "/2"
      - trigger: template
        value_template: "{{ states('sensor.ps_quarter_projected') | float(0) > states('input_number.ps_import_limit') | float(2.3) + 0.1 }}"
    conditions:
      - condition: state
        entity_id: input_boolean.ps_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.ps_winter_mode
        state: "on"
      - condition: state
        entity_id: input_boolean.ps_charged_tonight
        state: "off"
      - "{{ not is_state('input_boolean.dyn_enabled', 'on') }}"
      - condition: time
        after: input_datetime.ps_window_start
        before: input_datetime.ps_window_end
    actions:
      - variables:
          limit: "{{ states('input_number.ps_import_limit') | float(2.3) }}"
          proj: "{{ states('sensor.ps_quarter_projected') | float(0) }}"
          want: "{{ states('sensor.ps_desired_charge_current') | int(0) }}"
          have: "{{ states('sensor.ps_charge_current_setting') | int(0) }}"
          tou_on: "{{ is_state('binary_sensor.ps_time_of_use_on', 'on') }}"
      - choose:
          # Too much load: stop charging, battery helps cover the house
          - conditions: "{{ tou_on and (proj > limit + 0.1 or want < 10) }}"
            sequence:
              - action: script.ps_inverter
                data: { command: self_use }
          # Load dropped again: resume charging
          - conditions: "{{ (not tou_on) and want >= 15 and proj < limit - 0.2 }}"
            sequence:
              - action: script.ps_inverter
                data: { command: resume, amps: "{{ want }}" }
          # Adjust current only on a real change (limits writes to the inverter)
          - conditions: "{{ tou_on and (want - have) | abs >= 10 }}"
            sequence:
              - action: script.ps_inverter
                data: { command: current, amps: "{{ want }}" }

  # Stop when the target SOC is reached
  - id: ps_target_reached
    alias: "Peak shaving – target SOC reached"
    triggers:
      - trigger: template
        value_template: "{{ states('sensor.ps_battery_soc') | float(0) >= states('sensor.ps_night_target_soc') | float(100) - 1 }}"
    conditions:
      - condition: state
        entity_id: input_boolean.ps_enabled
        state: "on"
      - "{{ not is_state('input_boolean.dyn_enabled', 'on') }}"
      - condition: time
        after: input_datetime.ps_window_start
        before: input_datetime.ps_window_end
    actions:
      - action: input_boolean.turn_on
        target: { entity_id: input_boolean.ps_charged_tonight }
      - action: script.ps_inverter
        data: { command: self_use }

  # End of the night window (also when peak shaving is switched off)
  - id: ps_window_end
    alias: "Peak shaving – end of night window"
    triggers:
      - trigger: time
        at: input_datetime.ps_window_end
      - trigger: state
        entity_id: input_boolean.ps_enabled
        to: "off"
    conditions:
      - "{{ not is_state('input_boolean.dyn_enabled', 'on') }}"
    actions:
      - action: input_boolean.turn_off
        target: { entity_id: input_boolean.ps_charged_tonight }
      - action: script.ps_inverter
        data: { command: self_use }

  # Warn when a quarter-hour is heading over the limit
  - id: ps_peak_warning
    alias: "Peak shaving – quarter-hour peak warning"
    triggers:
      - trigger: template
        value_template: "{{ states('sensor.ps_quarter_projected') | float(0) > states('input_number.ps_import_limit') | float(2.3) + 0.3 }}"
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id: input_boolean.ps_enabled
        state: "on"
    actions:
      - action: persistent_notification.create
        data:
          title: "Capacity peak warning"
          message: >
            This quarter-hour is heading for {{ states('sensor.ps_quarter_projected') }} kW
            (battery {{ states('sensor.ps_battery_soc') }} %, house {{ states('sensor.ps_house_load') }} kW).
      # For a phone alert, add e.g.:
      # - action: notify.mobile_app_your_phone
      #   data: { message: "Capacity peak warning: {{ states('sensor.ps_quarter_projected') }} kW" }
